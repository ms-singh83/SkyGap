services:
  - type: web
    name: skygap
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMMA_PROVIDER
        value: google
      - key: TABPFN_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
