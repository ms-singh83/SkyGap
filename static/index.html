<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyGap</title>
<style>
  :root { --bg:#f4f7f2; --card:#fff; --ink:#1d2a1f; --muted:#5f6f62; --accent:#2f7d4a;
          --good:#3aa357; --mid:#e2b33c; --bad:#d9534f; --line:#dfe6dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111712; --card:#1a221c; --ink:#e6efe7; --muted:#9db0a1; --accent:#6cc48a; --line:#2a352c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px 48px; }
  h1 { margin:0; font-size:2rem; letter-spacing:-0.02em; }
  .tag { color:var(--muted); margin:4px 0 24px; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px 14px; font-size:1rem; border:1px solid var(--line);
          border-radius:10px; background:var(--card); color:var(--ink); }
  button { padding:12px 18px; font-size:1rem; border:0; border-radius:10px;
           background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:20px; margin-top:20px; }
  .big { font-size:1.6rem; font-weight:700; line-height:1.25; }
  .sub { color:var(--muted); font-size:.9rem; }
  .plan { white-space:pre-line; font-size:1.05rem; margin-top:12px; }
  .strip { display:grid; grid-template-columns:repeat(12,1fr); gap:4px; align-items:end;
           height:120px; margin-top:16px; }
  .bar { border-radius:4px 4px 0 0; position:relative; min-height:6px; }
  .bar.best { outline:2px solid var(--ink); outline-offset:1px; }
  .labels { display:grid; grid-template-columns:repeat(12,1fr); gap:4px; font-size:.65rem;
            color:var(--muted); text-align:center; margin-top:4px; }
  .vals { display:grid; grid-template-columns:repeat(12,1fr); gap:4px; font-size:.65rem;
          text-align:center; margin-bottom:2px; }
  .err { color:var(--bad); }
  footer { margin-top:28px; color:var(--muted); font-size:.85rem; text-align:center; }
  footer b { color:var(--ink); }
</style>
</head>
<body>
<main>
  <h1>SkyGap</h1>
  <p class="tag">Spend less time here, more time out there.</p>

  <form id="f">
    <input id="city" placeholder="Your city, e.g. Pune" autocomplete="off" required>
    <button id="go">Find my hour</button>
  </form>

  <div id="out"></div>

  <footer>
    Predicted with <b>TabPFN</b>, written by <b>Gemma</b>, hosted on <b>Render</b>.<br>
    <span id="mae">Air quality and weather from Open-Meteo.</span>
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const color = (a) => a <= 100 ? "var(--good)" : a <= 150 ? "var(--mid)" : "var(--bad)";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function run(city) {
  $("go").disabled = true;
  $("out").innerHTML = '<div class="card sub">Fetching 60 days of history and asking TabPFN...</div>';
  try {
    const r = await fetch("/api/plan?city=" + encodeURIComponent(city));
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "Something went wrong");
    render(d);
    try { localStorage.setItem("skygap-city", city); } catch (e) {}
  } catch (e) {
    $("out").innerHTML = `<div class="card err">${esc(e.message)}</div>`;
  } finally {
    $("go").disabled = false;
  }
}

function render(d) {
  const max = Math.max(200, ...d.hours.map((h) => h.aqi));
  const headline = d.best
    ? `Best time: ${esc(d.best.label.replace(" ", ":00 "))}, predicted AQI ${d.best.aqi}`
    : "No dry daylight hour in the next 12 hours";
  const bestTime = d.best && d.best.time;
  $("out").innerHTML = `
    <div class="card">
      <div class="sub">${esc(d.city)}</div>
      <div class="big">${headline}</div>
      <div class="plan">${esc(d.plan)}</div>
    </div>
    <div class="card">
      <div class="sub">Predicted AQI, next 12 hours</div>
      <div class="strip">${d.hours.map((h) =>
        `<div class="bar${h.time === bestTime ? " best" : ""}" title="${esc(h.label)}: AQI ${h.aqi}"
          style="height:${Math.max(5, (h.aqi / max) * 100)}%;background:${color(h.aqi)}"></div>`).join("")}</div>
      <div class="labels">${d.hours.map((h) => `<span>${esc(h.label.replace(" ", ""))}</span>`).join("")}</div>
      <div class="labels">${d.hours.map((h) => `<span>${h.aqi}</span>`).join("")}</div>
    </div>`;
  $("mae").innerHTML = `Backtest on the last 48h: <b>${esc(d.model)} MAE ${d.mae_model}</b>
    vs "same as 24h ago" baseline MAE ${d.mae_baseline}. Plan by ${esc(d.plan_source)}.`;
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); run($("city").value.trim()); });
try { const c = localStorage.getItem("skygap-city"); if (c) $("city").value = c; } catch (e) {}
</script>
</body>
</html>
